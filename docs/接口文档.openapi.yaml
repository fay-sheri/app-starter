      summary: 单token登录
      deprecated: false
      description: ''
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
            example:
              username: '{{$person.firstName}}'
              password: '{{rsa_password}}'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      userInfo:
                        type: object
                        properties:
                          id:
                            type: integer
                          username:
                            type: string
                        required:
                          - id
                          - username
                    required:
                      - token
                      - userInfo
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: 登录成功
                data:
                  token: eyJhbGciOiJIUzI1NiIs...
                  userInfo:
                    id: 1
                    username: admin
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
